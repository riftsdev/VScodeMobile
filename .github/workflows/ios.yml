name: Compilar iOS sem assinatura
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Compilar aplicativo
        run: >
          xcodebuild -project ios/App/App.xcodeproj
          -scheme App -configuration Release -sdk iphoneos
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar IPA não assinado
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr KG-Code-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KG-Code-iOS-SEM-ASSINATURA
          path: KG-Code-unsigned.ipa
