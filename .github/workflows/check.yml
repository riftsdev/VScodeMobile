name: Testar e empacotar KG Code
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Pacote web pronto
        uses: actions/upload-artifact@v4
        with:
          name: KG-Code-Web
          path: dist
          include-hidden-files: true
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-navegadores
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
